version: '3.8'

services:
  app:
    build: .
    container_name: milhas-api
    ports:
      - "8080:8080"
    environment:
      # Conecta ao banco 'milhas' e define o schema 'milhas'
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/milhas?currentSchema=milhas
      # Lê as credenciais do .env
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_FLYWAY_SCHEMAS=milhas
      # Passa o segredo JWT para a aplicação
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=86400000
      - FILE_UPLOAD_DIR=./uploads-docker # Define um caminho para dentro do container
    depends_on:
      - db
    volumes:
      # Monta o volume de uploads para persistência
      - ./uploads-docker:/app/uploads-docker

  db:
    image: postgres:15
    container_name: milhas-postgres-db
    ports:
      - "5432:5432"
    environment:
      # Lê as credenciais do .env
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql

volumes:
  postgres-data: