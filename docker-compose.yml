version: '3.8'

services:
  app:
    build: .
    container_name: milhas-api
    ports:
      - "8080:8080"
    environment:
      # Alinhamento exato com o application.properties
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/milhas?currentSchema=milhas
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_FLYWAY_SCHEMAS=milhas

      # Correção da injeção do Secret (Deve bater com o @Value da aplicação)
      - API_SECURITY_TOKEN_SECRET=${JWT_SECRET}
      - API_SECURITY_TOKEN_EXPIRATION=86400000

      # Configurações de diretório e performance
      - FILE_UPLOAD_DIR=/app/uploads-docker
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads-docker:/app/uploads-docker

  db:
    image: postgres:15
    container_name: milhas-postgres-db
    environment:
      - POSTGRES_USER=${SPRING_DATASOURCE_USERNAME}
      - POSTGRES_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - POSTGRES_DB=milhas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME} -d milhas"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql

volumes:
  postgres-data: