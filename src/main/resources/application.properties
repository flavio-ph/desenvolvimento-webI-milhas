spring.application.name=milhas
server.port=8080

# DATABASE
spring.datasource.url=jdbc:postgresql://localhost:5432/milhas?currentSchema=milhas
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.hikari.maximum-pool-size=10

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# FLYWAY
spring.flyway.enabled=true
spring.flyway.schemas=milhas

# SECURITY (JWT)
jwt.secret=NGRmZjk3YmE2ZGMwYjFlYjU4OGMxYTdkYjE4YjdiM2E0ZWE2YjVkYmU1YmQxZGVmZjVkZTU2Y2Y5YTMxZDY5YQ==
jwt.expiration=86400000

# STORAGE
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# PERFORMANCE & JSON
server.compression.enabled=true
spring.jackson.time-zone=America/Sao_Paulo
spring.mvc.problemdetails.enabled=true

# LOGGING
logging.level.com.web.milhas=INFO