spring.application.name=milhas
server.port=8080

# DATABASE
spring.datasource.url=jdbc:postgresql://localhost:5432/milhas?currentSchema=milhas
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# FLYWAY
spring.flyway.enabled=true
spring.flyway.schemas=milhas

# SECURITY (JWT)
jwt.secret=8z2pL9vX5nM1qW7eR3tY0uI4oP8aS2dF6gH0jK3lZ9xC5vB1nM7mQ4wE2rT9yU1i
jwt.expiration=86400000

# STORAGE
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# PERFORMANCE & JSON
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,application/javascript,text/css
server.compression.min-response-size=1024
spring.jackson.time-zone=America/Sao_Paulo
spring.mvc.problemdetails.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false

# ACTUATOR
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# LOGGING
logging.level.com.web.milhas=INFO



